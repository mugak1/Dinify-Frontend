name: Claude Code Review

on:
  pull_request:
    # Review once per PR, when it becomes reviewable — the same moments Codex
    # reviews on. Not on every push (`synchronize`): PRs here routinely take
    # many pushes, and each run is billed to the Claude plan behind
    # CLAUDE_CODE_OAUTH_TOKEN. Ask for a fresh review with an `@claude` comment.
    types: [opened, ready_for_review]

jobs:
  claude-review:
    # Same-repository, human-authored, non-draft PRs only. Fork and Dependabot
    # `pull_request` runs are not given Actions secrets (the OAuth token would
    # be empty) and the action refuses bot actors by default, so both would
    # only ever produce a failing check. A draft is reviewed when it is marked
    # ready.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !github.event.pull_request.draft

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
