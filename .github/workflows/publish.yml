# PUBLISH — the privileged boundary.
#
# It builds nothing, installs no application dependency and runs no repository script
# from the thing being published. It takes the candidate `certify.yml` produced, and
# publishes it only if ONE admitted unit survives from the decision to the served
# bytes:
#
# ┌─ gate ─────────────────────────────────────────────────────────────────────┐
# │ no credential. Reads the certifying run, downloads the candidate BY ITS    │
# │ ARTIFACT ID as data, reads the certified commit from git, the served       │
# │ identity, and the peers' receipts and serving, and evaluates               │
# │ release/lib/decide.mjs — the pure function the local suites drive. Emits   │
# │ the decision AND the admitted record (every identity the publisher must    │
# │ reproduce) with its digest.                                                │
# ├─ publish ──────────────────────────────────────────────────────────────────┤
# │ the ONLY job that may hold FIREBASE_SERVICE_ACCOUNT. No `npm ci`, no build │
# │ and no application source: the verifier PINNED to the revision the gate   │
# │ ran, the default branch's release/ tree (to notice a policy that moved),   │
# │ the certified commit's two hosting files, and the admitted artifact —      │
# │ downloaded by the record's id and digest. Inside one critical section it   │
# │ re-establishes the record, stages exactly what it verified, publishes,     │
# │ and then fetches the identity AND every certified file back.               │
# └────────────────────────────────────────────────────────────────────────────┘
#
# PUBLICATION IS DISABLED UNTIL AN OWNER ENABLES IT. The repository variable named in
# release/policy.json is not set, so the tool step is skipped and the run reports
# WOULD_PUBLISH — and today the gate refuses first anyway, naming the owner
# prerequisites that are outstanding. `deploy-prod.yml` is untouched and remains the
# live path: it still builds and publishes every merge to main, including the
# `angular.json` configuration this directory names. Setting the variable is NOT the
# cutover — see release/README.md.
#
# A READINESS EVALUATION IS NOT A FAILED RELEASE. While publication is disabled, the
# automatic run after every merge is an evaluation that is REQUIRED to refuse. When the
# refusal is EXACTLY the recorded, still-pending prerequisites
# (release/policy.json → publication.readiness.awaiting, each standing in its context —
# release/lib/readiness.mjs), the gate job completes green and says so: the decision
# stays REFUSE, allow:false, nothing is admitted and the publish job stays skipped. Any
# other refusal, any manual attempt, any enabled or invalid enablement value, and any
# evaluation that did not complete stays red.
name: Release readiness and publication
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Release attempt: manual {0} of {1}', inputs.mode, inputs.sha)
      || format('Readiness evaluation: automatic, {0}', github.event.workflow_run.head_sha) }}

on:
  # `workflow_run.workflows` can only match a workflow's mutable DISPLAY NAME. That is
  # a coarse pre-filter GitHub forces on us and is deliberately NOT the security
  # proof: the gate re-reads the triggering run through the API and the decision
  # requires it to be the workflow at release/policy.json's certification path.
  workflow_run:
    workflows: ["Certify"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character lowercase commit SHA on main that Certify has certified"
        required: true
        type: string
      mode:
        description: "deploy = publish this candidate · rollback = deliberate backward movement"
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

# ONE publication at a time, never cancelled mid-flight: the gate, the recheck, the
# promotion and the verification of one run are serialised against every other run
# of THIS workflow. Two limits, stated rather than implied. GitHub keeps at most one
# PENDING run per group, so a newer run queued behind a running one replaces an older
# pending run (which ends `cancelled` and published nothing). And this group does not
# contain deploy-prod.yml, which still publishes independently — that is why a single
# publisher is a named prerequisite the gate refuses without.
concurrency:
  group: publish-frontend
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    # The gate holds no credential and cannot publish, whatever it decides.
    name: Evaluate release readiness (non-publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A failed certification produces a cleanly skipped publication, not a red one: a
    # broken build is not a deployment incident, and turning every one into a failed
    # publish run trains the operator to ignore this workflow's red.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      allow: ${{ steps.decide.outputs.allow }}
      record: ${{ steps.decide.outputs.record }}
      record_digest: ${{ steps.decide.outputs.record_digest }}
      artifact_id: ${{ steps.decide.outputs.artifact_id }}
      run_id: ${{ steps.decide.outputs.run_id }}
      policy_revision: ${{ steps.decide.outputs.policy_revision }}
      sha: ${{ steps.identity.outputs.sha }}

    steps:
      - name: Refuse an unexpected event or ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_run|workflow_dispatch) ;;
            *) echo "refusing event $EVENT" >&2; exit 1 ;;
          esac
          # The workflow file is always taken from the default branch for both of these
          # events; anything else means an assumption here has stopped holding.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "refusing a run reported against $REF" >&2
            exit 1
          fi

      # THE TRUSTED CHECKOUT — the exact revision this workflow file was taken from, so
      # the gate's code and the YAML calling it cannot be two different versions. Never
      # the candidate: a candidate that supplied its own policy could relax its own
      # gate. Full history, because ancestry and ordering are answered from it.
      - name: Check out the trusted gate code
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve the target and the request
        id: identity
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$DISPATCH_SHA"; mode="$DISPATCH_MODE"; trigger="manual"
          else
            sha="$EVENT_SHA"; mode="deploy"; trigger="automatic"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "refusing a target that is not a full lowercase commit SHA" >&2
            exit 1
          fi
          case "$mode" in
            deploy|rollback) ;;
            *) echo "refusing mode $mode" >&2; exit 1 ;;
          esac
          printf 'sha=%s\nmode=%s\ntrigger=%s\n' "$sha" "$mode" "$trigger" >> "$GITHUB_OUTPUT"
          printf '{"mode":"%s","trigger":"%s","target":"%s"}\n' "$mode" "$trigger" "$sha" > request.json

      # The run, its latest attempt's jobs and its artifact listing, as the API reports
      # them — read by the trusted CLI, never by an ad-hoc pipe whose exit status a
      # shell could lose. An unresolvable run is data (present:false) the decision
      # refuses by name.
      - name: Establish the certifying run
        id: certification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.identity.outputs.sha }}
          TRIGGER: ${{ steps.identity.outputs.trigger }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          node release/cli.mjs certification-facts \
            --repo "$REPO" --target "$SHA" --trigger "$TRIGGER" --event-run-id "${EVENT_RUN_ID:-}" \
            --outputs "$GITHUB_OUTPUT" > certification.json

      # BY ID, from THAT run's own listing — never by name. The action verifies the
      # bytes against the digest the listing states, and the decision then requires
      # the id and the digest to be the ones the run lists for this attempt. Everything
      # after this treats the contents as untrusted input.
      - name: Download the candidate
        id: download
        if: steps.certification.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.certification.outputs.artifact_id }}
          run-id: ${{ steps.certification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error

      - name: Observe the candidate as data
        env:
          DOWNLOADED: ${{ steps.download.outcome }}
          ARTIFACT_ID: ${{ steps.certification.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [ "${DOWNLOADED:-skipped}" = "success" ]; then
            node release/cli.mjs observe --root candidate --artifact-id "$ARTIFACT_ID" > observation.json
          else
            printf '{"present":false,"artifactId":null,"unsafeEntries":[],"files":[]}\n' > observation.json
          fi

      # The certified commit AS GIT HOLDS IT — its source facts, storage declaration,
      # and the hosting configuration the tool would actually use (firebase.json AND
      # .firebaserc) over the files just downloaded.
      - name: Read the certified commit
        env:
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          node release/cli.mjs git-facts --commit "$SHA" --observation observation.json > facts.json

      - name: Read the served release identity
        env:
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          node release/cli.mjs serve-state --relate-to "$SHA" > served.json

      - name: Read the peers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node release/cli.mjs peer-facts > peers.json

      # `decide` keeps its own exit status: 1 on REFUSE, 0 on PROCEED or a SKIP. A
      # REFUSE — and ONLY exit status 1 — is asked ONE further question by the trusted
      # CLI: is it exactly the recorded waiting state of a non-publishing automatic
      # evaluation? Only that answer ends this step green; `readiness` exits 1 for
      # everything else, including a decision file it cannot read back. Any other
      # status from `decide` (a crash, a usage error) is passed through untranslated.
      # The decision file, its outputs (decision, allow) and the record are `decide`'s
      # alone and are not rewritten; the shadow-mode summary is written either way.
      - name: Decide
        id: decide
        env:
          ENABLEMENT: ${{ vars.FRONTEND_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          # Only a classification made HERE, about THIS decision, may be read by the
          # report below — never a file that was already in the workspace.
          rm -f readiness.json
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status=0
          node release/cli.mjs decide \
            --request request.json \
            --certification certification.json \
            --observation observation.json \
            --facts facts.json \
            --served served.json \
            --peers peers.json \
            --now "$now" \
            --record-out record.json \
            --outputs "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" > decision.json || status=$?
          cat decision.json
          if [ "$status" -eq 1 ]; then
            readiness=0
            node release/cli.mjs readiness \
              --decision decision.json \
              --request request.json \
              --facts facts.json \
              --served served.json \
              --peers peers.json \
              --enablement "$ENABLEMENT" \
              --out readiness.json \
              --outputs "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY" || readiness=$?
            exit "$readiness"
          fi
          exit "$status"

      # A decision other than PROCEED ends the run here, so its outcome is stated here —
      # including a run that stopped BEFORE deciding, which is refused and says so. If
      # it stopped before the trusted code was even checked out there is no CLI to ask,
      # and the summary states exactly that rather than nothing.
      - name: Report the outcome
        if: always() && steps.decide.outputs.decision != 'PROCEED'
        env:
          DECISION: ${{ steps.decide.outputs.decision }}
          CHECKED_OUT: ${{ steps.trusted.outcome }}
        run: |
          set -euo pipefail
          if [ "${CHECKED_OUT:-}" != "success" ]; then
            {
              echo "### Publication outcome: REFUSED"
              echo
              echo "The gate stopped before its own code was checked out, so no decision was reached."
              echo "Nothing was published. See the failed step above."
            } >> "$GITHUB_STEP_SUMMARY"
            echo '{"outcome":"REFUSED"}'
            exit 1
          fi
          node release/cli.mjs outcome --decision decision.json --decision-word "${DECISION:-}" --readiness readiness.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the gate's evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            request.json
            certification.json
            observation.json
            facts.json
            served.json
            peers.json
            decision.json
            readiness.json
            record.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish admitted candidate
    needs: gate
    # The EXPLICIT admitted decision, never "the gate job was green": a completed
    # readiness evaluation is green and is still a REFUSE.
    if: needs.gate.outputs.decision == 'PROCEED' && needs.gate.outputs.allow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      # THE VERIFIER THE GATE RAN — pinned to the revision named in the admitted record,
      # never "main as it is now". A policy or verifier that moved in between is not a
      # silent carry-on; the next checkout is how that is noticed.
      - name: Check out the verifier the gate ran
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.policy_revision }}
          path: trusted
          sparse-checkout: release
          persist-credentials: false

      - name: Check out the default branch's release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
          sparse-checkout: release
          persist-credentials: false

      # The certified commit's hosting configuration ONLY. No application source, no
      # package.json, no lockfile — nothing whose install or build could execute in
      # the job that holds the publishing credential. The tool is never pointed at
      # this checkout: it is read, and a narrow pair is regenerated from it.
      - name: Check out the certified hosting configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: certified
          sparse-checkout: |
            firebase.json
            .firebaserc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download the admitted candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id }}
          run-id: ${{ needs.gate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error

      # THE CRITICAL SECTION. The record is decoded and re-derived against its digest,
      # then every identity it names is re-established from what THIS job holds and
      # what the world says NOW: the verifier, the policy, the certifying run and its
      # attempt, the listed artifact, this job's own download, the regenerated hosting
      # configuration, the served release and the peers' serving. Only then is the
      # payload staged — beside the regenerated configuration, and nothing else.
      - name: Re-establish the admitted unit, then stage it
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RECORD: ${{ needs.gate.outputs.record }}
          RECORD_DIGEST: ${{ needs.gate.outputs.record_digest }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node trusted/release/cli.mjs preflight \
            --record-b64 "$RECORD" \
            --record-digest "$RECORD_DIGEST" \
            --repo "$REPO" \
            --now "$now" \
            --candidate candidate \
            --current current \
            --certified certified \
            --stage stage \
            --out preflight.json \
            --record-out record.json

      - name: Publication enablement
        id: enablement
        env:
          ENABLED: ${{ vars.FRONTEND_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # The tool is PINNED (the same literal is in release/policy.json and a drift test
      # holds the two together). Left at the action's default it resolves
      # `firebase-tools@latest` at run time — an unpinned executable fetched from the
      # network into the one job holding the service-account credential. It is pointed
      # at the STAGED directory: the regenerated firebase.json and .firebaserc, and the
      # verified payload.
      - name: Publish to Firebase Hosting
        id: publish
        if: steps.enablement.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dinify-dev
          target: dinify-prod
          channelId: live
          entryPoint: stage
          firebaseToolsVersion: '15.30.2'
          disableComment: 'true'

      # A publication is not finished because a runner step exited zero. The identity
      # and EVERY certified file are fetched back from the origin and compared against
      # the admitted record. Runs after a failed tool step too, so a tool that failed
      # after publishing is reported as degraded rather than as nothing.
      - name: Verify what the origin serves
        id: verify
        if: always() && steps.enablement.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node trusted/release/cli.mjs verify-served --record record.json --stage stage --out verification.json

      - name: Report the outcome
        if: always()
        env:
          DECISION: ${{ needs.gate.outputs.decision }}
          ENABLED: ${{ steps.enablement.outputs.enabled }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          node trusted/release/cli.mjs outcome \
            --decision-word "$DECISION" \
            --preflight preflight.json \
            --enabled "${ENABLED:-false}" \
            --publish-step "${PUBLISHED:-skipped}" \
            --verification verification.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the publisher's evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-publisher-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preflight.json
            record.json
            verification.json
          if-no-files-found: warn
          retention-days: 90
