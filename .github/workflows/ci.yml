name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # FULL HISTORY: the release suite replays the GENUINE pre-B2.2 stamp from this
          # repository's own history (release/tests/harness.mjs → commitPreB22Release)
          # to prove an old candidate is refused by name. A shallow clone lacks it.
          fetch-depth: 0

      - name: State what this run validated
        # WHAT A RUN TESTED IS PART OF ITS RESULT. On a pull request `actions/checkout`
        # takes `refs/pull/N/merge` — a SYNTHETIC MERGE that GitHub computes and that
        # exists under no branch. It is not the commit that will land on `main`, and a
        # green run here is therefore NOT a certification of anything that ships.
        # `certify.yml` is what certifies merged main. Stated rather than left to be
        # inferred, because conflating the two is exactly how a commit reaches the
        # live site having had nothing run against it.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Validated: SYNTHETIC MERGE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| pull-request head | \`$HEAD_SHA\` |"
            echo "| base | \`$BASE_REF\` |"
            echo "| merge ref tested | \`$MERGE_SHA\` |"
            echo
            echo "This is **not** a certification of a commit on \`main\`. The commit that"
            echo "merges is certified by \`certify.yml\`, and only that certification can"
            echo "authorize a publication."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DEPENDENCY AUDIT, part 1 of 2 (D08 B2.1 — dependency-audit/README.md). Taken
      # IMMEDIATELY after installation, before any repository code runs: it records the
      # exact lock graph and installed tree this job validates, and refuses if the tree
      # is not the lock graph. Offline. The scan at the end of this job is bound to it.
      - name: Dependency audit — snapshot the installed inventory
        run: npm run audit:snapshot

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Release-contract gate
        # The release certification contract (release/), run the same way the two
        # gates beside it are: the CLI's own --self-test first — a matcher that
        # silently stopped matching would otherwise pass everything — then the
        # refusal matrix that drives release/lib/decide.mjs from fixtures, the
        # adapter suites, and the simulation that executes publish.yml. Pure Node,
        # no browser, about half a minute, so it runs before the suites rather than
        # after them.
        run: npm run test:release

      - name: Dependency-audit evaluator tests
        # The evaluator's own regression matrix — offline and deterministic, fixtures
        # only. Proves the policy can pass AND refuse; it scans nothing and is not a
        # substitute for the scan at the end of this job.
        run: npm run test:audit

      - name: Tenant-isolation closure gate
        # Fail-fast boundary regression gate. Two things, in order:
        #   1. the platform-role source gate (FE-AUTH-00,
        #      scripts/check-platform-roles.mjs) — its own --self-test first, so a
        #      matcher that silently stopped matching fails here rather than
        #      passing everything;
        #   2. the tenant-boundary spec set (TENANT-ISO-PR6B): the focused _security
        #      closure spec + the diner-capability, QR-lifecycle and
        #      selected-restaurant specs it builds on.
        # Runs BEFORE the full suite so a broken boundary fails early. Mirrors
        # scripts/verify.sh; does NOT replace the full "Test" step below.
        run: npm run test:tenant-boundary

      - name: Test
        run: npm run test:ci

      - name: Build (production)
        run: npm run build:prod

      - name: Build the shipping candidate
        # The configuration that actually ships is built on the pull request too, so
        # a candidate that would fail certification fails BEFORE the merge rather
        # than after it. It is read from release/policy.json rather than typed here,
        # so the gate and the policy cannot drift apart.
        run: |
          set -euo pipefail
          configuration="$(node -p "require('./release/policy.json').build.configuration")"
          npx ng build --configuration="$configuration"

      - name: Dependency audit — scan the validated inventory and enforce the policy
        # DEPENDENCY AUDIT, part 2 of 2 — part of THIS required check, not a separate
        # one. Scans the snapshotted inventory (and the pinned scanner's own graph)
        # against the public advisory database and enforces the policy: a high/critical
        # finding anywhere, or any finding on a runtime (non-dev) package, fails `validate`; so
        # does a scan that could not complete — a timeout, an error body, an unparseable
        # or empty report, or an inventory that moved since the snapshot is never read
        # as clean. Placed LAST so the gates above still report when only the audit
        # fails. No `if:`, no `continue-on-error`, no pipe: its exit status is the step's.
        run: npm run audit:deps

      - name: Retain the dependency-audit evidence
        # The complete raw scanner output, the inventory and the decision, kept whether
        # the job passed or not. `always()` only retains evidence; it cannot turn a
        # failed step green.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit/evidence/
          if-no-files-found: warn
          retention-days: 30
