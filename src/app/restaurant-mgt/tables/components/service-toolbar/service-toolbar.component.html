<div class="bg-card rounded-lg border p-3 sm:p-4">
  <div class="flex flex-wrap items-center gap-3">
    <!-- N waiting — the server's count, never recomputed here -->
    <p
      data-testid="waiting-count"
      class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-semibold"
      [class.bg-amber-100]="!!waiting"
      [class.text-amber-900]="!!waiting"
      [class.bg-secondary]="!waiting"
      [class.text-secondary-foreground]="!waiting"
      aria-live="polite"
    >
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      {{ waiting ?? '–' }} waiting
    </p>

    <!-- Search -->
    <div class="relative flex-1 min-w-[180px] max-w-[280px]">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="absolute left-2.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="search"
        data-testid="floor-search"
        aria-label="Search tables"
        placeholder="Search tables"
        [ngModel]="search"
        (ngModelChange)="searchChange.emit($event)"
        class="w-full pl-8 h-9 text-sm rounded-md border border-input bg-background px-3 focus:outline-none focus:ring-2 focus:ring-ring"
      />
    </div>

    <!-- Status filter -->
    <div class="relative">
      <button
        type="button"
        data-testid="status-filter"
        class="h-9 text-sm inline-flex items-center gap-1.5 rounded-md border border-input bg-background px-3 hover:bg-accent hover:text-accent-foreground"
        [attr.aria-expanded]="showStatusDropdown"
        (click)="showStatusDropdown = !showStatusDropdown"
      >
        Status
        @if (statuses.length > 0) {
          <app-dn-badge variant="default" class="text-micro ml-0.5">{{ statuses.length }}</app-dn-badge>
        }
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      @if (showStatusDropdown) {
        <div class="absolute left-0 top-full mt-1 w-52 bg-card rounded-md shadow-lg border z-20 py-1" (mouseleave)="showStatusDropdown = false">
          @for (opt of statusOptions; track opt.value) {
            <label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-accent cursor-pointer">
              <input
                type="checkbox"
                class="h-4 w-4 rounded border-input"
                [attr.data-status]="opt.value"
                [checked]="statuses.includes(opt.value)"
                (change)="toggleStatus(opt.value)"
              />
              {{ opt.label }}
            </label>
          }
          @if (statuses.length > 0) {
            <button type="button" class="w-full text-left px-3 py-2 text-sm text-foreground underline-offset-4 hover:underline" (click)="clearStatuses()">Clear</button>
          }
        </div>
      }
    </div>
  </div>
</div>
