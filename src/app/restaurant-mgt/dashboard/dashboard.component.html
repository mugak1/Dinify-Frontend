<div class="space-y-4 sm:space-y-6">
  <!-- The timeframe control lives HERE, not in top-nav: TimeframeService is route-scoped,
  so the global chrome cannot inject it, and the page that owns a timeframe should own its
  control. `actions` is app-page-header's existing right-aligned slot — its wrapper already
  wraps the control below the title on narrow screens, so no layout classes are needed. -->
  <app-page-header
    title="Dashboard"
    [description]="'Last updated at ' + ((dashboardService.lastFetchTimestamp$ | async) | date:'HH:mm')"
  >
    <app-timeframe-picker
      actions
      [value]="(range$ | async)!"
      (valueChange)="onRange($event)"
      [comparison]="(comparison$ | async)!"
      [customComparisonFrom]="customComparisonFrom$ | async"
      (comparisonChange)="onComparison($event)"
    ></app-timeframe-picker>
  </app-page-header>

  <!-- Row 1: Revenue (large) + Payment Methods (compact) -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
    <div class="lg:col-span-2">
      <app-revenue-card
        [revenueData]="dashboardData?.revenue ?? null"
        [previousNet]="comparisonData?.revenue?.totals?.net ?? null"
        [comparisonWindow]="comparisonWindow"
        [range]="range"
        [bucketUnit]="bucketUnit"
        [loading]="loading"
        [error]="error"
        (retry)="retryDashboard()"
      ></app-revenue-card>
    </div>
    <app-payment-methods-card
      [paymentMethods]="dashboardData?.payments ?? null"
      [loading]="loading"
    ></app-payment-methods-card>
  </div>

  <!-- Row 2: Popular Items (compact) + Total Orders (large) -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
    <app-popular-items-card
      [items]="popularItems"
      [loading]="loading"
    ></app-popular-items-card>
    <div class="lg:col-span-2">
      <app-total-orders-card
        [ordersData]="dashboardData?.orders ?? null"
        [previousTotal]="comparisonData?.orders?.total ?? null"
        [comparisonWindow]="comparisonWindow"
        [range]="range"
        [bucketUnit]="bucketUnit"
        [loading]="loading"
      ></app-total-orders-card>
    </div>
  </div>

  <!-- Row 3: Tables (compact) + KDS Attention (large) -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
    <app-tables-card
      [tablesData]="dashboardData?.tables ?? null"
      [loading]="loading"
    ></app-tables-card>
    <div class="lg:col-span-2">
      <app-kds-attention-card
        [kdsData]="dashboardData?.kds ?? null"
        [loading]="loading"
      ></app-kds-attention-card>
    </div>
  </div>

  <!-- Row 4: Reviews (full width) -->
  <app-reviews-card
    [reviewsData]="reviewsData"
    [loading]="reviewsLoading"
    [error]="reviewsError"
    (retry)="retryReviews()"
  ></app-reviews-card>
</div>
